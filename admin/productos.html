<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos — NÜVE Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/nuve-ecommerce/admin/css/admin.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <span class="sidebar__logo">NÜVE</span>
      <span class="sidebar__subtitle">Admin Panel</span>
    </div>

    <nav class="sidebar__nav">
      <div class="sidebar__nav-label">Principal</div>
      <a href="/nuve-ecommerce/admin/dashboard.html" class="sidebar__link">
        <span class="sidebar__link-icon">◈</span> Dashboard
      </a>
      <a href="/nuve-ecommerce/admin/productos.html" class="sidebar__link active">
        <span class="sidebar__link-icon">◆</span> Productos
      </a>
      <a href="/nuve-ecommerce/admin/pedidos.html" class="sidebar__link">
        <span class="sidebar__link-icon">◇</span> Pedidos
      </a>

      <div class="sidebar__nav-label" style="margin-top:1.5rem;">Tienda</div>
      <a href="/nuve-ecommerce/frontend/index.html" target="_blank" class="sidebar__link">
        <span class="sidebar__link-icon">↗</span> Ver tienda
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user">Bienvenido, <span id="admin-username">Admin</span></div>
      <button class="sidebar__logout" id="btn-logout">
        <span>↩</span> Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hamburger-admin" id="hamburger-admin" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
        <span class="topbar__title">Productos</span>
      </div>
      <div class="topbar__actions">
        <button id="btn-nuevo-producto" class="btn btn-primary">+ Nuevo Producto</button>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        <div class="panel__header">
          <div class="admin-search">
            <input
              type="search"
              id="search-productos"
              class="search-input"
              placeholder="Buscar por nombre, categoría, tipo..."
            >
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Tipo</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="productos-tbody">
              <tr><td colspan="8" class="loading">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Crear / Editar Producto -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title" id="modal-title">Nuevo Producto</span>
        <button class="modal__close" id="btn-close-modal">✕</button>
      </div>
      <div class="modal__body">
        <form id="producto-form" onsubmit="event.preventDefault();">

          <div class="form-grid-2">
            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="f-nombre">Nombre *</label>
              <input type="text" id="f-nombre" class="form-input" required placeholder="Noir Absolu">
            </div>

            <div class="form-group">
              <label class="form-label" for="f-categoria">Categoría *</label>
              <select id="f-categoria" class="form-select">
                <option value="1">Originales</option>
                <option value="2">Testers</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="f-tipo">Tipo *</label>
              <select id="f-tipo" class="form-select">
                <option value="original">Original</option>
                <option value="tester">Tester</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="f-precio">Precio (ARS) *</label>
              <input type="number" id="f-precio" class="form-input" required min="0" step="0.01" placeholder="75000">
            </div>

            <div class="form-group">
              <label class="form-label" for="f-stock">Stock</label>
              <input type="number" id="f-stock" class="form-input" min="0" placeholder="10">
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="f-imagen">URL de imagen</label>
              <input type="url" id="f-imagen" class="form-input" placeholder="https://...">
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="f-nota">Nota olfativa</label>
              <input type="text" id="f-nota" class="form-input" placeholder="Bergamota, Oud, Sándalo...">
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="f-descripcion">Descripción</label>
              <textarea id="f-descripcion" class="form-textarea" rows="4" placeholder="Descripción del producto..."></textarea>
            </div>

            <div class="form-group" style="display:flex;flex-direction:row;align-items:center;gap:0.5rem;grid-column:1/-1;">
              <input type="checkbox" id="f-activo" style="width:16px;height:16px;accent-color:var(--negro);">
              <label class="form-label" for="f-activo" style="margin:0;">Activo (visible en la tienda)</label>
            </div>
          </div>

        </form>
      </div>
      <div class="modal__footer">
        <button class="btn btn-secondary" id="btn-cancel-modal">Cancelar</button>
        <button class="btn btn-primary" id="btn-save" onclick="saveProducto()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/nuve-ecommerce/admin/js/config.js"></script>
  <script src="/nuve-ecommerce/admin/js/auth.js"></script>
  <script src="/nuve-ecommerce/admin/js/productos.js"></script>
</body>
</html>
