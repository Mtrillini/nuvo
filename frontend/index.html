<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NÜVE Perfumería — Esencias premium de autor. Originales y Testers.">
  <title>NÜVE — Perfumería de Autor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://api.fontshare.com/v2/css?f[]=garet@400,700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar (injected by main.js) -->
  <div id="navbar"></div>

  <!-- ============================================================
       HERO SLIDER
       ============================================================ -->
  <section class="hero-slider">
    <div class="slider__track" id="slider-track">
      <div class="slider__slide">
        <picture>
          <source media="(max-width: 768px)" srcset="images/banner1-mobile.png">
          <img src="images/banner1.png" alt="NÜVE Banner 1">
        </picture>
      </div>
      <div class="slider__slide">
        <picture>
          <source media="(max-width: 768px)" srcset="images/banner2-mobile.png">
          <img src="images/banner2.png" alt="NÜVE Banner 2">
        </picture>
      </div>
      <div class="slider__slide">
        <picture>
          <source media="(max-width: 768px)" srcset="images/banner3-mobile.png">
          <img src="images/banner3.png" alt="NÜVE Coming Soon">
        </picture>
      </div>
    </div>

  </section>

  <!-- ============================================================
       MÁS VENDIDOS
       ============================================================ -->
  <div id="mas-vendidos"></div>

  <!-- ============================================================
       COLECCIONES
       ============================================================ -->
  <section class="colecciones-panels">

    <a href="productos?genero=masculino" class="colecciones-panel colecciones-panel--dark">
      <div class="colecciones-panel__content">
        <p class="colecciones-panel__label">PERFUMES</p>
        <h2 class="colecciones-panel__title">MASCULINOS</h2>
        <span class="colecciones-panel__cta">VER MÁS</span>
      </div>
    </a>

    <a href="productos?genero=femenino" class="colecciones-panel colecciones-panel--light">
      <div class="colecciones-panel__content">
        <p class="colecciones-panel__label">PERFUMES</p>
        <h2 class="colecciones-panel__title">FEMENINOS</h2>
        <span class="colecciones-panel__cta">VER MÁS</span>
      </div>
    </a>

  </section>

  <!-- Promo bar -->
  <div class="promo-bar">
    <div class="promo-bar__track">
      <div class="promo-bar__items">
        <span class="promo-bar__item"><i class="fa-solid fa-credit-card"></i> 3 cuotas sin interés</span>
        <span class="promo-bar__sep">✦</span>
        <span class="promo-bar__item"><i class="fa-solid fa-money-bill-wave"></i> 10% desc. abonando en efectivo</span>
        <span class="promo-bar__sep">✦</span>
        <span class="promo-bar__item"><i class="fa-solid fa-truck"></i> Envíos a domicilio</span>
        <span class="promo-bar__sep">✦</span>
      </div>
      <div class="promo-bar__items" aria-hidden="true">
        <span class="promo-bar__item"><i class="fa-solid fa-credit-card"></i> 3 cuotas sin interés</span>
        <span class="promo-bar__sep">✦</span>
        <span class="promo-bar__item"><i class="fa-solid fa-money-bill-wave"></i> 10% desc. abonando en efectivo</span>
        <span class="promo-bar__sep">✦</span>
        <span class="promo-bar__item"><i class="fa-solid fa-truck"></i> Envíos a domicilio</span>
        <span class="promo-bar__sep">✦</span>
      </div>
    </div>
  </div>

  <!-- ============================================================
       NEWSLETTER
       ============================================================ -->
  <section class="newsletter">
    <div class="newsletter__title">Únite al mundo NÜVE</div>
    <p class="newsletter__subtitle">Primero en conocer nuevas fragancias y ofertas exclusivas</p>
    <form class="newsletter__form" onsubmit="handleNewsletter(event)">
      <input
        type="email"
        class="newsletter__input"
        placeholder="tu@email.com"
        required
        autocomplete="email"
      >
      <button type="submit" class="newsletter__btn">Suscribirme</button>
    </form>
  </section>

  <!-- Modal detalle producto -->
  <div id="producto-modal" class="prod-modal" style="display:none;">
    <div class="prod-modal__overlay" onclick="cerrarModal()"></div>
    <div class="prod-modal__box">
      <button class="prod-modal__close" onclick="cerrarModal()">✕</button>
      <div class="prod-modal__img-wrap">
        <img id="modal-img" src="" alt="">
      </div>
      <div id="modal-thumbs" style="display:none;flex-direction:row;gap:0.4rem;padding:0.5rem 1.5rem 0;flex-wrap:wrap;"></div>
      <div class="prod-modal__info">
        <p id="modal-marca" class="prod-modal__marca"></p>
        <h2 id="modal-nombre" class="prod-modal__nombre"></h2>
        <p id="modal-tipo" class="prod-modal__tipo"></p>
        <p id="modal-desc" class="prod-modal__desc"></p>
        <div class="prod-modal__precio-wrap">
          <span id="modal-precio" class="prod-modal__precio"></span>
        </div>
        <div class="prod-modal__qty-wrap">
          <button onclick="cambiarQty(-1)">−</button>
          <span id="modal-qty">1</span>
          <button onclick="cambiarQty(1)">+</button>
        </div>
        <button class="prod-modal__btn" onclick="agregarDesdeModal()">AGREGAR AL CARRITO</button>
      </div>
    </div>
  </div>

  <!-- Footer (injected by main.js) -->
  <div id="footer"></div>

  <!-- WhatsApp flotante -->
  <a href="https://wa.me/541139225427" class="whatsapp-btn" target="_blank" aria-label="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/productos.js"></script>
  <script>
    (function () {
      const track = document.getElementById('slider-track');
      const dots  = document.querySelectorAll('.slider__dot');
      const total = document.querySelectorAll('.slider__slide').length;
      let current = 0, timer;

      function goTo(index) {
        current = (index + total) % total;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === current));
      }

      function startAuto() { timer = setInterval(() => goTo(current + 1), 5000); }

      dots.forEach(d => d.addEventListener('click', () => { clearInterval(timer); goTo(+d.dataset.index); startAuto(); }));

      startAuto();
    })();
  </script>
  <script>
    function handleNewsletter(e) {
      e.preventDefault();
      const email = e.target.querySelector('input[type="email"]').value;
      if (email) {
        showToast('¡Gracias por suscribirte a NÜVE!', 'success');
        e.target.reset();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadFeaturedProductos();
    });
  </script>
</body>
</html>
