<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NÜVE Perfumería — Esencias premium de autor. Originales y Testers.">
  <title>NÜVE — Perfumería de Autor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/nuvo/frontend/css/style.css">
  <link href="https://api.fontshare.com/v2/css?f[]=garet@400,700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar (injected by main.js) -->
  <div id="navbar"></div>

  <!-- ============================================================
       HERO SLIDER
       ============================================================ -->
  <section class="hero-slider">
    <div class="slider__track" id="slider-track">
      <div class="slider__slide">
        <img src="/nuvo/frontend/images/banner1.png" alt="NÜVE Banner 1">
      </div>
      <div class="slider__slide">
        <img src="/nuvo/frontend/images/banner2.png" alt="NÜVE Banner 2">
      </div>
      <div class="slider__slide">
        <img src="/nuvo/frontend/images/banner3.png" alt="NÜVE Coming Soon">
      </div>
    </div>

  </section>

  <!-- ============================================================
       MÁS VENDIDOS
       ============================================================ -->
  <div id="mas-vendidos"></div>

  <!-- ============================================================
       COLECCIONES
       ============================================================ -->
  <section class="colecciones-panels">

    <a href="/nuvo/frontend/productos.html?genero=masculino" class="colecciones-panel colecciones-panel--dark">
      <div class="colecciones-panel__content">
        <p class="colecciones-panel__label">PERFUMES</p>
        <h2 class="colecciones-panel__title">MASCULINOS</h2>
        <span class="colecciones-panel__cta">VER MÁS</span>
      </div>
    </a>

    <a href="/nuvo/frontend/productos.html?genero=femenino" class="colecciones-panel colecciones-panel--light">
      <div class="colecciones-panel__content">
        <p class="colecciones-panel__label">PERFUMES</p>
        <h2 class="colecciones-panel__title">FEMENINOS</h2>
        <span class="colecciones-panel__cta">VER MÁS</span>
      </div>
    </a>

  </section>

  <!-- ============================================================
       NEWSLETTER
       ============================================================ -->
  <section class="newsletter">
    <div class="newsletter__title">Únite al mundo NÜVE</div>
    <p class="newsletter__subtitle">Primero en conocer nuevas fragancias y ofertas exclusivas</p>
    <form class="newsletter__form" onsubmit="handleNewsletter(event)">
      <input
        type="email"
        class="newsletter__input"
        placeholder="tu@email.com"
        required
        autocomplete="email"
      >
      <button type="submit" class="newsletter__btn">Suscribirme</button>
    </form>
  </section>

  <!-- Footer (injected by main.js) -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script>
  (function () {
    const productos = [
      { rank: 1, nombre: 'La Bomba',        marca: 'Carolina Herrera',  tipo: 'Eau de Parfum', precio: 100000, img: '/nuvo/frontend/images/prod-labomba.webp' },
      { rank: 2, nombre: 'Scandal Absolu',  marca: 'Jean Paul Gaultier', tipo: 'Eau de Parfum', precio: 100000, img: '/nuvo/frontend/images/prod-scandal.jpg'  },
      { rank: 3, nombre: 'Phantom EDT',     marca: 'Paco Rabanne',       tipo: 'Eau de Toilette', precio: 100000, img: '/nuvo/frontend/images/prod-phantom.webp' },
      { rank: 4, nombre: '212 VIP Black',   marca: 'Carolina Herrera',  tipo: 'Eau de Parfum', precio: 100000, img: '/nuvo/frontend/images/prod-212vip.jpg'   },
    ];

    const fmt = n => '$ ' + n.toLocaleString('es-AR');

    const section = document.getElementById('mas-vendidos');
    if (!section) return;

    Object.assign(section.style, {
      background: '#ffffff',
      padding: '4rem 3rem',
      fontFamily: "'Montserrat', sans-serif",
    });

    // Header
    const header = document.createElement('div');
    Object.assign(header.style, {
      display: 'flex',
      alignItems: 'flex-start',
      justifyContent: 'space-between',
      marginBottom: '2.5rem',
    });

    const titleWrap = document.createElement('div');

    const title = document.createElement('h2');
    title.textContent = 'MÁS VENDIDOS';
    Object.assign(title.style, {
      fontFamily: "'Cormorant', Georgia, serif",
      fontSize: '2rem',
      fontWeight: '300',
      letterSpacing: '4px',
      color: '#1a1a1a',
      marginBottom: '0.4rem',
    });

    titleWrap.appendChild(title);

    const verTodos = document.createElement('a');
    verTodos.textContent = 'VER TODOS LOS PRODUCTOS';
    verTodos.href = '/nuvo/frontend/productos.html';
    Object.assign(verTodos.style, {
      fontFamily: "'Montserrat', sans-serif",
      fontSize: '0.68rem',
      fontWeight: '500',
      letterSpacing: '2.5px',
      color: '#555',
      textDecoration: 'none',
      borderBottom: '1px solid #999',
      paddingBottom: '2px',
      alignSelf: 'center',
    });

    header.appendChild(titleWrap);
    header.appendChild(verTodos);
    section.appendChild(header);

    // Grid
    const grid = document.createElement('div');
    Object.assign(grid.style, {
      display: 'grid',
      gridTemplateColumns: 'repeat(4, 1fr)',
      gap: '1.5rem',
      maxWidth: '1200px',
      margin: '0 auto',
    });

    productos.forEach(p => {
      const card = document.createElement('div');
      Object.assign(card.style, {
        background: '#fff',
        borderRadius: '4px',
        border: '1px solid #e8e0d8',
        overflow: 'hidden',
        display: 'flex',
        flexDirection: 'column',
        transition: 'box-shadow 0.3s',
        position: 'relative',
        cursor: 'pointer',
      });
      card.addEventListener('mouseenter', () => card.style.boxShadow = '0 8px 30px rgba(0,0,0,0.10)');
      card.addEventListener('mouseleave', () => card.style.boxShadow = 'none');

      // Rank badge
      const badge = document.createElement('span');
      badge.textContent = '#' + p.rank;
      Object.assign(badge.style, {
        position: 'absolute',
        top: '12px',
        left: '12px',
        background: '#e8ddd0',
        color: '#6b5a45',
        fontSize: '0.6rem',
        fontWeight: '600',
        letterSpacing: '1px',
        padding: '3px 7px',
        borderRadius: '2px',
      });

      // Image
      const imgWrap = document.createElement('div');
      Object.assign(imgWrap.style, {
        background: '#ffffff',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        height: '300px',
        overflow: 'hidden',
      });
      const img = document.createElement('img');
      img.src = p.img;
      img.alt = p.nombre;
      Object.assign(img.style, { width: '100%', height: '100%', objectFit: 'contain' });

      imgWrap.appendChild(img);

      // Info
      const info = document.createElement('div');
      Object.assign(info.style, { padding: '1.2rem 1.2rem 1.4rem' });

      const nombre = document.createElement('div');
      nombre.textContent = p.nombre;
      Object.assign(nombre.style, {
        fontFamily: "'Garet', 'Nunito', sans-serif",
        fontSize: '1.05rem',
        fontWeight: '400',
        letterSpacing: '0.5px',
        color: '#1a1a1a',
        marginBottom: '2px',
      });

      const marca = document.createElement('div');
      marca.textContent = p.marca;
      Object.assign(marca.style, {
        fontSize: '0.68rem',
        color: '#888',
        letterSpacing: '1px',
        marginBottom: '2px',
      });

      const tipo = document.createElement('div');
      tipo.textContent = p.tipo;
      Object.assign(tipo.style, {
        fontSize: '0.65rem',
        color: '#aaa',
        letterSpacing: '0.5px',
        marginBottom: '0.8rem',
      });

      const precio = document.createElement('div');
      precio.textContent = fmt(p.precio);
      Object.assign(precio.style, {
        fontSize: '1rem',
        fontWeight: '600',
        color: '#1a1a1a',
        marginBottom: '1rem',
      });

      const btn = document.createElement('button');
      btn.textContent = 'AGREGAR AL CARRITO';
      Object.assign(btn.style, {
        width: '100%',
        padding: '0.75rem',
        background: '#1a1a1a',
        color: '#e8d8c7',
        border: 'none',
        fontFamily: "'Montserrat', sans-serif",
        fontSize: '0.65rem',
        fontWeight: '600',
        letterSpacing: '2.5px',
        cursor: 'pointer',
        transition: 'background 0.3s',
      });
      btn.addEventListener('mouseenter', () => btn.style.background = '#3a2810');
      btn.addEventListener('mouseleave', () => btn.style.background = '#1a1a1a');

      info.appendChild(nombre);
      info.appendChild(marca);
      info.appendChild(tipo);
      info.appendChild(precio);
      info.appendChild(btn);

      card.appendChild(badge);
      card.appendChild(imgWrap);
      card.appendChild(info);
      grid.appendChild(card);
    });

    section.appendChild(grid);
  })();
  </script>

  <script src="/nuvo/frontend/js/config.js"></script>
  <script src="/nuvo/frontend/js/main.js"></script>
  <script src="/nuvo/frontend/js/carrito.js"></script>
  <script src="/nuvo/frontend/js/productos.js"></script>
  <script>
    (function () {
      const track = document.getElementById('slider-track');
      const dots  = document.querySelectorAll('.slider__dot');
      const total = document.querySelectorAll('.slider__slide').length;
      let current = 0, timer;

      function goTo(index) {
        current = (index + total) % total;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === current));
      }

      function startAuto() { timer = setInterval(() => goTo(current + 1), 5000); }

      dots.forEach(d => d.addEventListener('click', () => { clearInterval(timer); goTo(+d.dataset.index); startAuto(); }));

      startAuto();
    })();
  </script>
  <script>
    function handleNewsletter(e) {
      e.preventDefault();
      const email = e.target.querySelector('input[type="email"]').value;
      if (email) {
        showToast('¡Gracias por suscribirte a NÜVE!', 'success');
        e.target.reset();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadFeaturedProductos();
    });
  </script>
</body>
</html>
